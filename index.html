<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Expense Tracker</title> <link rel="stylesheet" href="style.css"> </head> <body>
<div class="container">

    <!-- Header -->
    <header>
        <h1>Expense Tracker</h1>
        <p>Track your spending, one expense at a time.</p>
    </header>

    <!-- Summary -->
    <section class="summary">

        <div class="summary-card">
            <span>Total Spent</span>
            <h2 id="totalAmount">₹0.00</h2>
        </div>

        <div class="summary-card">
            <span>Total Expenses</span>
            <h2 id="expenseCount">0</h2>
        </div>

    </section>

    <!-- Expense Form -->
    <section class="expense-form">

        <h2 id="formTitle">Add Expense</h2>

        <form id="expenseForm">

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description</label>

                <input
                    type="text"
                    id="description"
                    placeholder="e.g. Lunch"
                    required
                >
            </div>

            <!-- Amount -->
            <div class="form-group">
                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="e.g. 250"
                    min="1"
                    step="0.01"
                    required
                >
            </div>

            <!-- Category -->
            <div class="form-group">
                <label for="category">Category</label>

                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn">
                Add Expense
            </button>

        </form>

    </section>

    <!-- Expenses -->
    <section class="expenses">

        <div class="expenses-header">
            <h2>Recent Expenses</h2>

            <button
                type="button"
                id="clearAll"
                class="clear-btn"
            >
                Clear All
            </button>
        </div>

        <!-- JavaScript will add expenses here -->
        <div id="expenseList">

            <p class="empty-message">
                No expenses yet.
            </p>

        </div>

    </section>

</div>

<!-- JavaScript -->
<script src="script.js"></script>

</body> </html>
